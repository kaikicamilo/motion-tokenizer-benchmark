# Shared hyperparameters for the SnapMoGen benchmark.
# Method configs inherit via `_base_` and override only the quantizer block.
exp:
  root_ckpt_dir: './checkpoint_dir'
  root_log_dir: './log'
  name: 'benchmark'
  device: 'cuda:0'
  is_continue: False
  is_train: True
  seed: 10306

# Frozen retrieval evaluator released with the dataset (see README, 'Evaluators').
evaluator: './checkpoint_dir/snapmogen/evaluator/eval_klde-5_late-5_nlayer6_norm'

data:
  name: 'snapmogen'
  unit_length: 4
  # Path to the SnapMoGen dataset (not distributed with this repo — see README).
  root_dir: './data/SnapMoGen'
  joint_num: 24
  dim_pose: 296
  fps: 30
  max_motion_length: 320
  motion_length: 128
  max_text_length: 120
  min_motion_length: 128

quantizer:
  code_dim: 512
  nb_code: 2048
  quantize_dropout_prob: 0
  num_quantizers: 4
  shared_codebook: False
  share_quant_resi: 4
  quant_resi: 0
  start_drop: -1
  version: 'v2'
  mu: 0.99

model:
  down_t: 2
  stride_t: 2
  width: 512
  depth: 3
  dilation_growth_rate: 3
  vq_act: 'relu'
  use_attn: True
  vq_norm: None

training:
  batch_size: 256
  max_epoch: 1000
  lambda_fk: 0
  lambda_commit: 0.02
  lambda_global: 1.5
  lambda_expicit: 2
  ema: False
  weight_decay: 0.0
  lr: 3.0e-4
  milestones: [300, 700]
  gamma: 0.3
  warm_up_iter: 2000
  log_every: 10
  save_latest: 500
  eval_every_e: 10
  recons_loss: 'l1_smooth'
