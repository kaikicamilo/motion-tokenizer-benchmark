# Shared hyperparameters for the HumanML3D benchmark.
# Mirrors configs/snapmogen/base.yaml; only the data block differs.
exp:
  root_ckpt_dir: './checkpoint_dir'
  root_log_dir: './log'
  name: 'benchmark_hml'
  device: 'cuda:0'
  is_continue: False
  is_train: True
  seed: 10306

# Frozen retrieval evaluator released with the dataset (see README, 'Evaluators').
evaluator: './checkpoint_dir/humanml3d/Comp_v6_KLD005/opt.txt'

data:
  name: 'humanml3d'
  unit_length: 4
  # Path to the HumanML3D dataset (not distributed with this repo — see README).
  root_dir: './data/HumanML3D'
  joint_num: 22
  dim_pose: 263
  fps: 20
  max_motion_length: 196
  motion_length: 128
  max_text_length: 20
  min_motion_length: 40

quantizer:
  code_dim: 512
  nb_code: 2048
  quantize_dropout_prob: 0
  num_quantizers: 4
  shared_codebook: False
  share_quant_resi: 4
  quant_resi: 0
  start_drop: -1
  version: 'v2'
  mu: 0.99

model:
  down_t: 2
  stride_t: 2
  width: 512
  depth: 3
  dilation_growth_rate: 3
  vq_act: 'relu'
  use_attn: True
  vq_norm: None

training:
  batch_size: 256
  max_epoch: 1000
  lambda_fk: 0
  lambda_commit: 0.02
  lambda_global: 1.5
  lambda_expicit: 2
  ema: False
  weight_decay: 0.0
  lr: 3.0e-4
  milestones: [300, 700]
  gamma: 0.3
  warm_up_iter: 2000
  log_every: 10
  save_latest: 500
  eval_every_e: 10
  recons_loss: 'l1_smooth'
